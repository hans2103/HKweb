version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint doesn't support TS 7 yet (peer: typescript <6.1), so lint fails (#102).
      # Remove once https://github.com/typescript-eslint/typescript-eslint/issues/10940 is resolved.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node major the site runs on (24.x, the newest
      # Vercel offers). Bump it together with .nvmrc and engines.node (#120).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Each family has a routine group (minor/patch) and a separate *-major group.
    # Majors stay bundled (packages with exact peer pins must move together, a
    # partial bump never installs) but arrive as their own PR, titled
    # "...-major group", so a breaking upgrade isn't merged as a routine bump.
    # A dependency goes to the first group that matches it.
    groups:
      astro:
        update-types: ["minor", "patch"]
        patterns:
          - astro
          - "@astrojs/*"
          - "*-astro"
          - astro-*
      astro-major:
        update-types: ["major"]
        patterns:
          - astro
          - "@astrojs/*"
          - "*-astro"
          - astro-*
      eslint:
        update-types: ["minor", "patch"]
        patterns:
          - eslint
          - eslint-*
          - "@eslint/*"
          - typescript-eslint
      eslint-major:
        update-types: ["major"]
        patterns:
          - eslint
          - eslint-*
          - "@eslint/*"
          - typescript-eslint
      vitest:
        update-types: ["minor", "patch"]
        patterns:
          - vitest
          - "@vitest/*"
      vitest-major:
        update-types: ["major"]
        patterns:
          - vitest
          - "@vitest/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
