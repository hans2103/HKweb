name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # astro check + astro build; the tests below read the built dist/.
      - run: npm run build
      - run: npx vitest run
      # Lighthouse on the built pages: every category must stay at 100
      # (lighthouserc.json). Replaces the Checkly deployment checks.
      - run: npx --yes @lhci/cli@0.15.1 autorun
